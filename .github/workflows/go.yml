name: Go

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal assets/embed.go)"
      - name: Dependency consistency
        run: go mod tidy -diff
      - name: Vet
        run: go vet ./...
      - name: Tests and race detector
        run: go test -race -shuffle=on ./...
      - name: Build
        run: go build -o bin/server ./cmd/server
      - name: Vulnerability analysis
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
